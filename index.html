:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}

html,body{margin:0}

.ib svg,.nav svg,.dot svg,.qa svg{width:22px;height:22px}
.sync{font-size:13px;opacity:.85;margin-top:6px;min-height:20px}

.fig{position:relative;min-height:200px}

.tg input{width:24px;height:24px;min-height:0;accent-color:var(--red)}
.hint{font-size:13px;color:var(--mut);margin-top:-4px}

.toast{position:fixed;inset-inline:14px;bottom:calc(92px + env(safe-area-inset-bottom));max-width:600px;margin:0 auto;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:14px;display:flex;justify-content:space-between;align-items:center;gap:12px;z-index:20;font-size:15px}

.set .row{cursor:default}
.set select,.set input{border:1px solid var(--line);background:var(--soft);border-radius:10px;padding:8px 10px;font-size:16px;max-width:9em}

{

let db=null,gRef=null,yCol=null,dirty=new Set(),pt=0,syncMsg='محفوظ على هذا الجهاز';
const qs={};
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify({S,E}));return true}catch(e){return false}}
function loadLocal(){try{const x=JSON.parse(localStorage.getItem(LS)||localStorage.getItem(LS_OLD)||'null');if(x&&x.S){S=Object.assign(defS(),x.S);S.set=Object.assign(defS().set,x.S.set||{});E=x.E||{}}}catch(e){}}
function persist(keys){const ok=saveLocal();if(!ok)UI.toast(UI.t('car.storageFull'),{tone:'danger',duration:6000});if(!db)return ok;keys.forEach(k=>dirty.add(k));clearTimeout(pt);pt=setTimeout(flush,500)}
function flush(){
  for(const k of [...dirty]){
    dirty.delete(k);
    const ref=k==='g'?gRef:yCol.doc('y'+k);
    const body=k==='g'?clone(S):{items:clone(E[k]||[])};
    qs[k]=(qs[k]||Promise.resolve()).then(()=>ref.set(body)).catch(err=>{
      if(err&&err.code==='unavailable'){setTimeout(()=>persist([k]),1500+Math.random()*1000)}
      else if(err&&err.code==='quota_exceeded'){UI.toast('مساحة التخزين السحابي ممتلئة — صدّر نسخة احتياطية')}
      else if(err&&err.code==='invalid_argument'){db=null;setSync('محفوظ على هذا الجهاز فقط')}
    });
  }
}
function setSync(m){syncMsg=m;const el=$('#sync');if(el)el.textContent=m;const e2=$('#sync2');if(e2)e2.textContent=m}
function connect(){}

const {openSheet,closeSheet}=UI;

const tab=()=>{const h=location.hash.slice(1);return ['home','car','log','remind','reports','settings'].includes(h)?h:'home'};

/* ---------- screens ---------- */
function home(){return renderHome(homeCtx)}
const homeCtx={get S(){return S},veh,curOdo,stats,rstat,items,monthStart,
  selectCar:id=>{S.cur=id;persist(['g']);render()},addCar:()=>openVehicleEditor(carCtx)};
const carCtx={get S(){return S},veh,curOdo,stats,rstat,items,uid:uidg,render:()=>render(),
  save:keys=>{const ok=saveLocal();if(ok&&db)persist(keys);return ok},
  setLogFilter:t=>{LF.t=t},deleteVehicle};
const entryCtx={get S(){return S},get E(){return E},cats,items,all,curOdo,stats,veh,uid:uidg,today,iso,render:()=>render(),
  persist:keys=>{const ok=saveLocal();if(ok)persist(keys);return ok},addVehicle:()=>openVehicleEditor(carCtx),addReminder:()=>openReminderForm(entryCtx)};
function deleteVehicle(id){
  const keys=['g'];Object.keys(E).forEach(k=>{const before=E[k].length;E[k]=E[k].filter(z=>z.v!==id);if(E[k].length!==before)keys.push(k)});
  S.vehicles=S.vehicles.filter(z=>z.id!==id);S.reminders=S.reminders.filter(r=>r.v!==id);S.docs=(S.docs||[]).filter(d=>d.v!==id);S.cur=S.vehicles[0]?.id||null;
  persist(keys);render();
}

let LF={t:'all',q:''};
const reportsCtx={get S(){return S},veh,stats,monthStart,today,render:()=>render()};
const settingsCtx={get S(){return S},get E(){return E},all,cats,CATS,render:()=>render(),
  persist:keys=>{const ok=saveLocal();if(ok)persist(keys);return ok},
  install:()=>({standalone:standalone(),canPrompt:!!deferredPrompt,ios:/iPhone|iPad|iPod/.test(navigator.userAgent)}),
  wipe:()=>{const keys=['g',...Object.keys(E)];Object.keys(E).forEach(k=>E[k]=[]);S=defS();persist(keys);location.hash='home';render();UI.toast(UI.t('set.wiped'))}};
const logCtx={get S(){return S},get LF(){return LF},items,veh,render:()=>render()};
const remCtx={get S(){return S},veh,stats,rstat,render:()=>render()};
const SCR={home,car:()=>renderCar(carCtx),log:()=>renderLog(logCtx),remind:()=>renderReminders(remCtx),reports:()=>renderReports(reportsCtx),settings:()=>renderSettings(settingsCtx)};

/* ---------- phone calendar (.ics) ---------- */
function icsFor(r){
  const s=rstat(r);if(!s.dueDate)return;const V=veh(r.v),d=s.dueDate.replace(/-/g,''),b=+(r.before??7)||0;
  const ttl=((V?vehTitle(V)+' - ':'')+r.name).replace(/[,;\\]/g,' ');
  const alarm=t=>['BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+ttl,'TRIGGER:'+t,'END:VALARM'];
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Sayarati//AR','BEGIN:VEVENT','UID:'+r.id+'-'+d+'@sayarati','DTSTAMP:'+new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z','DTSTART:'+d+'T090000','DTEND:'+d+'T093000','SUMMARY:'+ttl,...(b?alarm('-P'+b+'D'):[]),...alarm('PT0M'),'END:VEVENT','END:VCALENDAR'];
  give('sayarati-reminder-'+d+'.ics',L.join('\r\n'),'text/calendar');
}
/* ---------- backup via share sheet (Google Drive) ---------- */
const backupText=()=>JSON.stringify({app:'sayarati',v:1,S,E});
async function driveSave(){
  const name='sayarati-backup-'+today()+'.json',text=backupText();
  const file=new File([text],name,{type:'application/json'});
  const done=()=>{S.set.lastDrive=new Date().toISOString();persist(['g']);render()};
  if(navigator.canShare&&navigator.canShare({files:[file]})){
    try{await navigator.share({files:[file],title:UI.t('set.backupTitle')});done();UI.toast(UI.t('set.shared'),{tone:'success'});return}
    catch(e){if(e&&e.name==='AbortError')return}
  }
  download(name,text,'application/json');done();UI.toast(UI.t('set.downloaded'),{tone:'success'});
}
let ro=null;
function render(){
  if(S.vehicles.length&&!veh(S.cur))S.cur=S.vehicles[0].id;
  const t=tab();
  $('#main').innerHTML=SCR[t]();
  renderNav(t==='car'?'home':t==='settings'?'':t);
  afterRenderReports(reportsCtx);
}
/* ---------- forms ---------- */
/* ---------- backup ---------- */
function download(name,text,mime){
  const u=URL.createObjectURL(new Blob([text],{type:mime}));const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);
}
async function give(name,text,mime){
  if(/calendar/.test(mime)){
    const file=new File([text],name,{type:mime});
    if(/iPhone|iPad|iPod/.test(navigator.userAgent)){location.href='data:text/calendar;charset=utf-8,'+encodeURIComponent(text);return}
    download(name,text,mime);UI.toast(UI.t('rems.calOpened'));return;
  }
  download(name,text,mime);UI.toast(UI.t('set.exported'),{tone:'success'});
}
function csv(){
  const head=['السيارة','النوع','التاريخ','العداد','الصنف/الوقود','اللترات','سعر اللتر','المبلغ','خزان ممتلئ','المكان','ملاحظة'];
  const q=s=>'"'+String(s??'').replace(/"/g,'""')+'"';
  const rows=all().sort((a,b)=>a.d.localeCompare(b.d)).map(x=>[veh(x.v)?.name,T[x.t].n,x.d,x.odo||'',x.t==='fuel'?x.fuel:x.cat,x.liters||'',x.ppl||'',x.cost,x.t==='fuel'?(x.full?'نعم':'لا'):'',x.place,x.note].map(q).join(','));
  return '﻿'+[head.map(q).join(','),...rows].join('\n');
}
function importFile(file){const rd=new FileReader();rd.onload=()=>importText(rd.result);rd.readAsText(file)}
function importText(text){
  {try{const x=JSON.parse(text);if(!x||!x.S||!Array.isArray(x.S.vehicles)||typeof x.E!=='object')throw 0;
    UI.confirmDialog({title:UI.t('set.importQ'),text:UI.t('set.importText'),confirmText:UI.t('set.importOk'),tone:'warning',ic:'upload'}).then(yes=>{if(!yes)return;
      const keys=new Set(['g',...Object.keys(E)]);Object.keys(E).forEach(k=>E[k]=[]);
      S=Object.assign(defS(),x.S);S.set=Object.assign(defS().set,x.S.set||{});
      Object.entries(x.E).forEach(([k,v])=>{if(/^\d{4}$/.test(k)&&Array.isArray(v)){E[k]=v;keys.add(k)}});
      persist([...keys]);render();UI.toast(UI.t('set.imported'),{tone:'success'});});
  }catch(e){UI.toast(UI.t('set.badFile'),{tone:'danger'})}}
}
function demo(){
  const v={id:uidg(),make:'toyota',model:'Camry',year:2021,name:'تويوتا Camry',plate:'نموذج',fuel:'M91',tank:60,odo0:62000,photoCat:{make:'toyota',model:'Camry',body:'sedan',color:'silver'}};
  S.vehicles.push(v);S.cur=v.id;const keys=new Set(['g']);
  const push=x=>{x.id=uidg();x.v=v.id;const y=x.d.slice(0,4);(E[y]=E[y]||[]).push(x);keys.add(y)};
  const d=new Date();d.setMonth(d.getMonth()-8);let odo=62000,lastOil=62000,i=0;
  const places=['شل','المها','نفط عمان'];
  push({t:'fuel',d:iso(d),odo,liters:52,ppl:.229,cost:11.908,full:true,fuel:'M91',place:'شل'});
  const ins=new Date(d);ins.setDate(ins.getDate()+10);push({t:'expense',d:iso(ins),cat:'تأمين',cost:145,place:'شركة التأمين'});
  push({t:'expense',d:iso(ins),cat:'تجديد الملكية',cost:25,place:'شرطة عمان السلطانية'});
  while(true){
    d.setDate(d.getDate()+5+(i*3)%4);if(d>new Date())break;
    const km=380+((i*137)%170);odo+=km;const k=11.2+((i*53)%25)/10,L=+(km/k).toFixed(2),p=i<14?.229:.233;
    push({t:'fuel',d:iso(d),odo,liters:L,ppl:p,cost:+(L*p).toFixed(3),full:i%5!==3,fuel:'M91',place:places[i%3]});
    if(odo-lastOil>=5000){lastOil=odo;push({t:'service',d:iso(d),odo,cat:'تغيير زيت المحرك',cost:18.5,place:'مركز الخدمة'})}
    if(i%6===2)push({t:'expense',d:iso(d),odo,cat:'غسيل',cost:3,place:'مغسلة'});
    if(i===20)push({t:'service',d:iso(d),odo,cat:'ترصيص وميزان',cost:12,place:'محل الإطارات'});
    i++;
  }
  let lastOilDate=today();all().forEach(x=>{if(x.v===v.id&&x.cat==='تغيير زيت المحرك')lastOilDate=x.d});
  S.reminders.push({id:uidg(),v:v.id,name:'تغيير زيت المحرك',km:5000,months:6,lastOdo:lastOil,lastDate:lastOilDate});
  S.reminders.push({id:uidg(),v:v.id,name:'تأمين',km:0,months:12,lastOdo:0,lastDate:iso(ins)});
  S.reminders.push({id:uidg(),v:v.id,name:'إطارات',km:40000,months:48,lastOdo:50000,lastDate:'2025-03-01'});
  persist([...keys]);location.hash='home';render();UI.toast(UI.t('set.demoAdded'));
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,id=b.dataset.id;
  if(a==='fab')openTypePicker(entryCtx);
  else if(a==='add')openEntryForm(entryCtx,b.dataset.t);
  else if(a==='edit'){const x=all().find(z=>z.id===id);if(x)openEntryForm(entryCtx,x.t,x)}
  else if(a==='addveh')openVehicleEditor(carCtx);
  else if(a==='editveh')openVehicleEditor(carCtx,id);
  else if(a==='addrem')openReminderForm(entryCtx);
  else if(a==='editrem')openReminderForm(entryCtx,id);
  else if(a==='donerem'){const r=S.reminders.find(z=>z.id===id);if(r){const c=r.cat||r.name,isS=!cats('expense').includes(c);closeSheet();openEntryForm(entryCtx,isS?'service':'expense',null,{cat:c,odo:curOdo(r.v)})}}
  else if(a==='ics'){const r=S.reminders.find(z=>z.id===id);if(r)openCalendarSheet(remCtx,r)}
  else if(a==='icsfile'){const r=S.reminders.find(z=>z.id===id);closeSheet();if(r)icsFor(r)}
  else if(a==='drvsave')driveSave();
  else if(a==='install')doInstall();
  else if(a==='expjson')give('sayarati-backup-'+today()+'.json',backupText(),'application/json');
  else if(a==='expcsv')give('sayarati-'+today()+'.csv',csv(),'text/csv');
  else if(a==='demo')demo();
});
document.addEventListener('input',e=>{
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='s-cur'){S.set.cur=t.value.trim()||'ر.ع';persist(['g'])}
  else if(t.id==='s-dec'){S.set.dec=+t.value;persist(['g'])}
  else if(t.id==='s-unit'){S.set.unit=t.value;persist(['g'])}
  else if(t.id==='imp'&&t.files[0]){importFile(t.files[0]);t.value=''}
});
window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0)});

/* ---------- install (PWA) ---------- */
let deferredPrompt=null;
const standalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;if(tab()==='settings')render()});
window.addEventListener('appinstalled',()=>{deferredPrompt=null;UI.toast(UI.t('set.installed'),{tone:'success'});render()});
async function doInstall(){if(!deferredPrompt)return;deferredPrompt.prompt();try{await deferredPrompt.userChoice}catch(e){}deferredPrompt=null;render()}
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
/* ---------- shell navigation (design system) ---------- */
function renderNav(cur){
  const items=[['home','house','nav.home'],['log','list','nav.log'],['remind','bell','nav.reminders'],['reports','chart-column','nav.reports']];
  const a=([k,ic,l])=>`<a class="mc-navitem" href="#${k}" ${k===cur?'aria-current="page"':''}><span class="mc-navitem__pill">${UI.icon(ic)}</span>${UI.esc(UI.t(l))}</a>`;
  const fab=`<button class="mc-fab" type="button" data-act="fab" aria-label="${UI.esc(UI.t('nav.add'))}">${UI.icon('plus')}</button>`;
  $('#nav-bottom').innerHTML=`<div class="mc-bottomnav__inner">${a(items[0])}${a(items[1])}${fab}${a(items[2])}${a(items[3])}</div>`;
  $('#nav-rail').innerHTML=fab+items.map(a).join('');
  for(const n of [$('#nav-bottom'),$('#nav-rail')])n.setAttribute('aria-label',UI.t('appName'));
}
UI.initPrefs();
initHome(homeCtx);
initCar(carCtx);
initReports(reportsCtx);
initSettings(settingsCtx);
initLog(logCtx);
document.addEventListener('mc:lang',()=>render());
document.addEventListener('mc:theme',()=>render());
loadLocal();render();
}
