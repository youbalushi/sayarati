  const fp=inP.filter(x=>x.t==='fuel'),L=fp.reduce((s,x)=>s+(+x.liters||0),0);
  const ks=cp.map(c=>c.k);
  return {it,inP,cons:cp,allCons:cons,avg:lit?dist/lit:0,by,spend,span,cpk:span?spend/span:0,kmDay:days>6?span/days:0,L,ppl:L?by.fuel/L:0,fills:fp.length,
    best:ks.length?Math.max(...ks):0,worst:ks.length?Math.min(...ks):0,lastFuel:fuel[fuel.length-1],odoDate:(it.filter(x=>+x.odo).sort((a,b)=>b.odo-a.odo)[0]||{}).d||today()};
}
function rstat(r,st){
  const odo=curOdo(r.v);let km=null,days=null;const by=r.by||'both';
  if(by!=='date'){if(r.odoDue)km=(+r.odoDue)-odo;else if(+r.km)km=(+r.lastOdo||0)+(+r.km)-odo}
  if(by!=='odo'){if(r.date){days=Math.round((new Date(r.date)-new Date(today()))/864e5)}
  else if(+r.months){const d=new Date(r.lastDate||today());d.setMonth(d.getMonth()+(+r.months));days=Math.round((d-new Date(today()))/864e5)}}
  const kmWin=+r.km||5000;
  let pct=0;if(km!=null)pct=Math.max(pct,1-km/kmWin);if(days!=null)pct=Math.max(pct,1-days/((+r.months||1)*30.4));
  const done=km==null&&days==null&&!!r.done;
  const due=(km!=null&&km<=0)||(days!=null&&days<=0);
  const soon=!due&&((km!=null&&km<=Math.min(1000,kmWin*.15))||(days!=null&&days<=14));
  st=st||stats(r.v);
  const eta=km!=null&&km>0&&st.kmDay>0?Math.round(km/st.kmDay):null;
  let dueDate=days!=null?addDays(today(),days):null;
  if(km!=null){const kd=km<=0?st.odoDate:(st.kmDay>0?addDays(st.odoDate,Math.round(km/st.kmDay)):null);if(kd&&(!dueDate||kd<dueDate))dueDate=kd}
  return {km,days,pct:done?0:Math.min(1,Math.max(0,pct)),due,soon,eta,dueDate,done};
}

function persist(keys){const ok=saveLocal();if(!ok)UI.toast(UI.t('car.storageFull'),{tone:'danger',duration:6000});if(!db)return ok;keys.forEach(k=>dirty.add(k));clearTimeout(pt);pt=setTimeout(flush,500)}
function flush(){
  for(const k of [...dirty]){
    dirty.delete(k);
    const ref=k==='g'?gRef:yCol.doc('y'+k);
    const body=k==='g'?clone(S):{items:clone(E[k]||[])};
    qs[k]=(qs[k]||Promise.resolve()).then(()=>ref.set(body)).catch(err=>{
      if(err&&err.code==='unavailable'){setTimeout(()=>persist([k]),1500+Math.random()*1000)}

function icsFor(r){

function drawCons(){
  if(ro){ro.disconnect();ro=null}
  const f=$('#consfig');if(!f)return;
  const since=RP?monthStart(RP-1):'';const c=stats(S.cur,since).cons;
  const svg=$('svg',f);
  const draw=()=>{
    const W=f.clientWidth,H=f.clientHeight;if(!W)return;
    const l100=S.set.unit==='l100',val=x=>l100?100/x.k:x.k;
    const vs=c.map(val),mn=Math.min(...vs),mx=Math.max(...vs),pad=(mx-mn)*.15||1,lo=mn-pad,hi=mx+pad;
    const L=34,R=10,Tp=14,B=24,iw=W-L-R,ih=H-Tp-B;
    const X=i=>L+(c.length<2?iw/2:i/(c.length-1)*iw),Y=v=>Tp+(1-(v-lo)/(hi-lo))*ih;
    const avg=vs.reduce((a,b)=>a+b,0)/vs.length;
    const pts=vs.map((v,i)=>`${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(' ');
    const ticks=[lo+pad,(lo+hi)/2,hi-pad];
    svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
    svg.innerHTML=`${W>=320?ticks.map(t=>`<line x1="${L}" x2="${W-R}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--line)"/><text x="${L-6}" y="${Y(t)+4}" font-size="11" fill="var(--mut)" text-anchor="end" direction="ltr">${t.toFixed(1)}</text>`).join(''):''}
     <line x1="${L}" x2="${W-R}" y1="${Y(avg)}" y2="${Y(avg)}" stroke="var(--amber)" stroke-dasharray="4 4"/>
     <polyline points="${pts}" fill="none" stroke="var(--red)" stroke-width="2.5" stroke-linejoin="round"/>
     ${vs.map((v,i)=>`<circle cx="${X(i)}" cy="${Y(v)}" r="3.5" fill="var(--card)" stroke="var(--red)" stroke-width="2"><title>${fdate(c[i].d)}: ${v.toFixed(1)}</title></circle>`).join('')}
     <text x="${L}" y="${H-6}" font-size="11" fill="var(--mut)">${esc(fdate(c[0].d))}</text>
     <text x="${W-R}" y="${H-6}" font-size="11" fill="var(--mut)" text-anchor="end">${esc(fdate(c[c.length-1].d))}</text>`;
  };
  ro=new ResizeObserver(draw);ro.observe(f);
}

function download(name,text,mime){

}
async function give(name,text,mime){

    if(/iPhone|iPad|iPod/.test(navigator.userAgent)){location.href='data:text/calendar;charset=utf-8,'+encodeURIComponent(text);return}
    download(name,text,mime);toast('افتح الملف المنزّل لإضافته للتقويم');return;

}

function renderNav(cur){
  const items=[['home','house','nav.home'],['log','list','nav.log'],['remind','bell','nav.reminders'],['reports','chart-column','nav.reports']];
  const a=([k,ic,l])=>`<a class="mc-navitem" href="#${k}" ${k===cur?'aria-current="page"':''}><span class="mc-navitem__pill">${UI.icon(ic)}</span>${UI.esc(UI.t(l))}</a>`;
  const fab=`<button class="mc-fab" type="button" data-act="fab" aria-label="${UI.esc(UI.t('nav.add'))}">${UI.icon('plus')}</button>`;
  $('#nav-bottom').innerHTML=`<div class="mc-bottomnav__inner">${a(items[0])}${a(items[1])}${fab}${a(items[2])}${a(items[3])}</div>`;
  $('#nav-rail').innerHTML=fab+items.map(a).join('');
  for(const n of [$('#nav-bottom'),$('#nav-rail')])n.setAttribute('aria-label',UI.t('appName'));
}
UI.initPrefs();
initHome(homeCtx);
initCar(carCtx);
document.addEventListener('mc:lang',()=>render());
document.addEventListener('mc:theme',()=>render());
loadLocal();render();
}
